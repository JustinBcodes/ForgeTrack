services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgetrack}
      POSTGRES_USER: ${POSTGRES_USER:-forgetrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgetrack}
    ports:
      - "5432:5432"
    volumes:
      - forgetrack-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgetrack-data:

